name: jobmap_iraq
description: JobMap Iraq - Location-based recruitment platform
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  jwt_decoder: ^2.0.0
  dio: ^5.3.0
  flutter_secure_storage: ^9.0.0
  json_serializable: ^6.7.0
  json_annotation: ^4.8.0
  google_sign_in: ^6.2.0
  flutter_facebook_auth: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android:
    notification_icon: "launcher_notification"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: false
  macos:
    generate: false
