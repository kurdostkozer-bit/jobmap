services:
  - type: web
    name: jobmap-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production

databases:
  - name: jobmap-db
    databaseName: jobmap_ssqr
    user: jobmap_user
    region: frankfurt
