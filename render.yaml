services:
  - type: web
    name: jobmap-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && rm -rf node_modules && npm ci && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production

databases:
  - name: jobmap-db
    databaseName: jobmap_ssqr
    user: jobmap_user
    region: frankfurt
