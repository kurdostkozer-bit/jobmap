services:
  - type: web
    name: jobmap-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && rm -rf node_modules && npm ci && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production

  - type: static_site
    name: jobmap-frontend
    staticPublishPath: web/dashboard/build
    buildCommand: cd web/dashboard && npm install && npm run build
    routes:
      - path: /*
        destination: /index.html
    headers:
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: jobmap-db
    databaseName: jobmap_ssqr
    user: jobmap_user
    region: frankfurt
