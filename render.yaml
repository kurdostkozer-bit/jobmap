services:
  - type: web
    name: jobmap-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm --prefix backend ci && npm --prefix backend run build
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production

  - type: static_site
    name: jobmap-web
    staticPublishPath: web
    buildCommand: echo "Static site - no build needed"
    routes:
      - path: /*
        destination: /index.html
    headers:
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: jobmap-db
    databaseName: jobmap_ssqr
    user: jobmap_user
    region: frankfurt
