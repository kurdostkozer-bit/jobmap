services:
  - type: web
    name: jobmap-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        scope: build
      - key: DB_PORT
        scope: build
      - key: DB_USER
        scope: build
      - key: DB_PASSWORD
        scope: build
      - key: DB_NAME
        scope: build

  - type: static_site
    name: jobmap-web
    staticPublishPath: web
    buildCommand: echo "Static site - no build needed"
    routes:
      - path: /*
        destination: /index.html
    headers:
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: jobmap-db
    databaseName: jobmap_ssqr
    user: jobmap_user
    region: frankfurt
