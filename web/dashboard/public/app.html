<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMap - لوحة التحكم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .success {
            color: #27ae60;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.error {
            background: #fadbd8;
            color: #c0392b;
            border-left: 4px solid #c0392b;
            display: block;
        }

        .message.success {
            background: #d5f4e6;
            color: #27ae60;
            border-left: 4px solid #27ae60;
            display: block;
        }

        .toggle-btn {
            text-align: center;
            margin-top: 20px;
        }

        .toggle-btn button {
            background: none;
            color: #667eea;
            text-decoration: underline;
            padding: 5px;
            margin: 0;
            cursor: pointer;
            font-size: 14px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .user-info {
            display: none;
            text-align: center;
            margin-bottom: 20px;
        }

        .user-info.active {
            display: block;
        }

        .user-info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .user-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .logout-btn {
            background: #e74c3c;
            margin-top: 20px;
        }

        .logout-btn:hover {
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
        }

        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Message Box -->
        <div id="message" class="message"></div>

        <!-- Login Section -->
        <div id="loginSection" class="form-section active">
            <div class="header">
                <h1>🔐 تسجيل الدخول</h1>
                <p>JobMap - منصة التوظيف</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <div class="loading" id="loginLoading">جاري التحقق...</div>
                <button type="submit" id="loginBtn">تسجيل الدخول</button>
            </form>

            <div class="toggle-btn">
                <button onclick="toggleForm('register')">ليس لديك حساب؟ سجل الآن</button>
            </div>
        </div>

        <!-- Register Section -->
        <div id="registerSection" class="form-section">
            <div class="header">
                <h1>✍️ إنشاء حساب</h1>
                <p>انضم إلى JobMap الآن</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="registerFirstName">الاسم الأول</label>
                    <input type="text" id="registerFirstName" placeholder="أحمد" required>
                </div>

                <div class="form-group">
                    <label for="registerLastName">اسم العائلة</label>
                    <input type="text" id="registerLastName" placeholder="محمد" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">البريد الإلكتروني</label>
                    <input type="email" id="registerEmail" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">كلمة المرور</label>
                    <input type="password" id="registerPassword" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="registerRole">نوع الحساب</label>
                    <select id="registerRole" required>
                        <option value="seeker">طالب وظيفة</option>
                        <option value="employer">صاحب عمل</option>
                    </select>
                </div>

                <div class="loading" id="registerLoading">جاري إنشاء الحساب...</div>
                <button type="submit" id="registerBtn">إنشاء الحساب</button>
            </form>

            <div class="toggle-btn">
                <button onclick="toggleForm('login')">لديك حساب؟ سجل الدخول</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="form-section">
            <div class="header">
                <h1>📊 لوحة التحكم</h1>
                <p>JobMap - منصة التوظيف</p>
            </div>

            <div id="userInfo" class="user-info active">
                <h3 id="userName">مرحباً بك</h3>
                <p>البريد الإلكتروني: <strong id="userEmail">-</strong></p>
                <p>نوع الحساب: <strong id="userRole">-</strong></p>
                <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        // Toggle between forms
        function toggleForm(type) {
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.getElementById(type + 'Section').classList.add('active');
        }

        // Show message
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            setTimeout(() => {
                msg.className = 'message';
            }, 5000);
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            document.getElementById('loginLoading').classList.add('active');
            document.getElementById('loginBtn').disabled = true;

            try {
                const response = await fetch(API_BASE_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('auth_token', data.accessToken);
                    localStorage.setItem('refresh_token', data.refreshToken);
                    showMessage('تم تسجيل الدخول بنجاح', 'success');
                    setTimeout(() => showDashboard(data.user), 1000);
                } else {
                    showMessage(data.message || 'خطأ في تسجيل الدخول', 'error');
                }
            } catch (err) {
                showMessage('خطأ في الاتصال بالخادم', 'error');
            } finally {
                document.getElementById('loginLoading').classList.remove('active');
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const firstName = document.getElementById('registerFirstName').value;
            const lastName = document.getElementById('registerLastName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('registerRole').value;

            document.getElementById('registerLoading').classList.add('active');
            document.getElementById('registerBtn').disabled = true;

            try {
                const response = await fetch(API_BASE_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ firstName, lastName, email, password, role })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('auth_token', data.accessToken);
                    localStorage.setItem('refresh_token', data.refreshToken);
                    showMessage('تم إنشاء الحساب بنجاح', 'success');
                    setTimeout(() => showDashboard(data.user), 1000);
                } else {
                    showMessage(data.message || 'خطأ في إنشاء الحساب', 'error');
                }
            } catch (err) {
                showMessage('خطأ في الاتصال بالخادم', 'error');
            } finally {
                document.getElementById('registerLoading').classList.remove('active');
                document.getElementById('registerBtn').disabled = false;
            }
        });

        // Show Dashboard
        function showDashboard(user) {
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.getElementById('dashboardSection').classList.add('active');
            document.getElementById('userName').textContent = 'مرحباً بك، ' + user.firstName + ' ' + user.lastName;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userRole').textContent = user.role === 'seeker' ? 'طالب وظيفة' : 'صاحب عمل';
        }

        // Logout
        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('refresh_token');
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            toggleForm('login');
            showMessage('تم تسجيل الخروج', 'success');
        }

        // Check login on load
        window.addEventListener('load', async () => {
            const token = localStorage.getItem('auth_token');
            if (token) {
                try {
                    const response = await fetch(API_BASE_URL + '/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (response.ok) {
                        const user = await response.json();
                        showDashboard(user);
                    } else {
                        localStorage.removeItem('auth_token');
                    }
                } catch (err) {
                    console.error('Error checking auth:', err);
                }
            }
        });
    </script>
</body>
</html>
